@if (data(); as dialog) {
  <div
    class="confirm-dialog-backdrop"
    role="presentation"
    (click)="cancelled.emit()"
    (keydown.escape)="cancelled.emit()"
  >
    <div
      class="confirm-dialog"
      [class.confirm-dialog-danger]="dialog.tone !== 'default'"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-dialog-title"
      aria-describedby="confirm-dialog-message"
      tabindex="-1"
      (click)="$event.stopPropagation()"
    >
      <h2 id="confirm-dialog-title" class="confirm-dialog-title">{{ dialog.title }}</h2>
      <p id="confirm-dialog-message" class="confirm-dialog-message">{{ dialog.message }}</p>
      @if (dialog.note) {
        <p class="confirm-dialog-note">{{ dialog.note }}</p>
      }
      <div class="confirm-dialog-actions">
        <button type="button" class="btn btn-sm btn-ghost" autofocus (click)="cancelled.emit()">
          {{ dialog.cancelLabel ?? 'Cancelar' }}
        </button>
        <button
          type="button"
          class="btn btn-sm confirm-dialog-confirm"
          [class.confirm-dialog-confirm-danger]="dialog.tone !== 'default'"
          (click)="confirmed.emit()"
        >
          {{ dialog.confirmLabel ?? 'Eliminar' }}
        </button>
      </div>
    </div>
  </div>
}
