<header class="header__container">
  <div class="header__content">
    <a [routerLink]="'/'">EssenceVapes</a>

    <ul class="header__nav">
      <li>
        <a [routerLink]="'/'" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          >Inicio</a
        >
      </li>
      <li><a [routerLink]="'/productos'" routerLinkActive="active">Productos</a></li>
      <li><a [routerLink]="'/contacto'" routerLinkActive="active">Contacto</a></li>
    </ul>

    <div class="user__actions">
      <button
        type="button"
        class="icon-btn"
        disabled
        aria-label="Carrito (muy pronto)"
        title="Muy pronto"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>
      </button>

      @if (authService.isRestoring()) {
        <span class="auth-action-skeleton" aria-hidden="true"></span>
      } @else if (authService.isAuthenticated()) {
        <div class="user-menu-wrapper">
          <button
            type="button"
            class="icon-btn user-trigger"
            [attr.aria-expanded]="userMenuOpen()"
            [attr.aria-label]="'Cuenta de ' + (authService.user()?.fullName ?? '')"
            (click)="toggleUserMenu()"
          >
            {{ userInitial() }}
          </button>

          @if (userMenuOpen()) {
            <div class="user-menu" role="menu">
              <p class="user-menu-name">{{ authService.user()?.fullName }}</p>
              <p class="user-menu-email">{{ authService.user()?.email }}</p>
              <a
                class="user-menu-link"
                role="menuitem"
                [routerLink]="'/favoritos'"
                (click)="userMenuOpen.set(false)"
              >
                <svg
                  width="15"
                  height="15"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  aria-hidden="true"
                >
                  <path
                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
                  />
                </svg>
                Mis favoritos
              </a>
              <button type="button" class="user-menu-logout" role="menuitem" (click)="logout()">
                Cerrar sesión
              </button>
            </div>
          }
        </div>
      } @else {
        <a
          class="btn btn-sm btn-ghost"
          [routerLink]="'/auth/login'"
          [queryParams]="{ returnUrl: router.url }"
        >
          Iniciar sesión
        </a>
      }
    </div>
  </div>
</header>
