<section class="account-page">
  <div class="account-shell">
    <aside class="account-sidebar">
      <nav class="account-nav" aria-label="Secciones de la cuenta">
        <span class="account-nav-heading">Mi cuenta</span>
        <a
          [routerLink]="'/cuenta/informacion-personal'"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
        >
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c0-4 3.5-6 8-6s8 2 8 6" />
          </svg>
          Información personal
        </a>
        <a
          [routerLink]="'/cuenta/direcciones'"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
        >
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 21s-7-5.5-7-11a7 7 0 1 1 14 0c0 5.5-7 11-7 11Z" />
            <circle cx="12" cy="10" r="2.5" />
          </svg>
          Direcciones
        </a>
        <a
          [routerLink]="'/cuenta/pedidos'"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
        >
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 8l9-4 9 4-9 4-9-4Z" />
            <path d="M3 8v9l9 4 9-4V8" />
            <path d="M12 12v9" />
          </svg>
          Pedidos
        </a>
        <a
          [routerLink]="'/cuenta/seguridad'"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
        >
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3l7 3.5v5c0 4.5-3 7.5-7 9.5-4-2-7-5-7-9.5v-5L12 3Z" />
            <path d="M9.5 12l2 2 3.5-3.5" />
          </svg>
          Seguridad
        </a>
      </nav>

      <div class="account-sidebar-footer">
        <div class="account-sidebar-user">
          <span class="account-sidebar-avatar" aria-hidden="true">{{ userInitial() }}</span>
          <div class="account-sidebar-user-info">
            <span class="account-sidebar-name">{{ authService.user()?.fullName }}</span>
            <span class="account-sidebar-email">{{ authService.user()?.email }}</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="account-main">
      <router-outlet />
    </main>
  </div>
</section>
