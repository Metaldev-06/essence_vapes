<div class="account-content">
  <header class="account-content-header">
    <h1 class="account-content-title">Pedidos</h1>
    <p class="account-content-subtitle">El historial de tus compras.</p>
  </header>

  <section class="account-card card account-empty">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 8l9-4 9 4-9 4-9-4Z" />
      <path d="M3 8v9l9 4 9-4V8" />
      <path d="M12 12v9" />
    </svg>
    <p class="account-empty-title">Todavía no tenés pedidos</p>
    <p class="account-empty-subtitle">
      Cuando compres en Essence Vapes, vas a ver el estado y el historial de tus pedidos acá.
    </p>
    <a class="btn btn-primary" [routerLink]="'/productos'">Ver catálogo</a>
  </section>
</div>
