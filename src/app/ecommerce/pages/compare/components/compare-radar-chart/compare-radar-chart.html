<svg class="compare-radar" viewBox="0 0 260 260" role="img" aria-label="Radar de acordes comparados">
  @for (ring of radar().rings; track $index) {
    <polygon [attr.points]="ring" class="compare-radar-ring" />
  }
  @for (axis of radar().axisLines; track $index) {
    <line x1="130" y1="130" [attr.x2]="axis.x2" [attr.y2]="axis.y2" class="compare-radar-ring" />
  }
  @for (serie of radar().series; track serie.color) {
    <polygon [attr.points]="serie.points" class="compare-radar-shape" [style.--series-color]="serie.color" />
  }
  @for (label of radar().labels; track label.text) {
    <text [attr.x]="label.x" [attr.y]="label.y" [attr.text-anchor]="label.anchor" class="compare-radar-label">
      {{ label.text }}
    </text>
  }
</svg>

<div class="compare-radar-legend">
  @for (product of products(); track product.id + '::' + product.variantId; let i = $index) {
    <span class="compare-radar-legend-item" [style.--series-color]="seriesColor(i)">
      @if (product.images[0]; as cover) {
        <img [ngSrc]="cover.url" [alt]="product.name" width="18" height="18" class="compare-legend-photo" />
      } @else {
        <span class="compare-dot" aria-hidden="true"></span>
      }
      {{ product.name }}
    </span>
  }
</div>
