@if (items().length > 0) {
  <div class="favorites-recommendations">
    <div class="favorites-recommendations-header">
      <div>
        <span class="favorites-recommendations-label">Descubrimientos según tu perfil</span>
        <h2 class="favorites-recommendations-title">
          Recomendados <em class="section-title-accent">para vos</em>
        </h2>
        <p class="favorites-recommendations-subtitle">
          Fragancias que complementan tus gustos y amplían tu colección.
        </p>
      </div>

      <div class="favorites-recommendations-actions">
        <a [routerLink]="'/productos'" class="favorites-recommendations-link">
          Ver catálogo completo
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </a>
        <div class="favorites-recommendations-nav">
          <button type="button" aria-label="Anterior" (click)="scroll(-1)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 6-6 6 6 6" />
            </svg>
          </button>
          <button type="button" aria-label="Siguiente" (click)="scroll(1)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 6 6 6-6 6" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="favorites-recommendations-track" #track>
      @for (product of items(); track product.id + '::' + product.variantId) {
        <div class="favorites-recommendations-item">
          <app-product-card [product]="product" />
        </div>
      }
    </div>
  </div>
}
