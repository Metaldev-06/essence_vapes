<section id="categorias" class="section categories-section">
  <div class="container">
    <div class="section-header">
      <div>
        <span class="section-label">Explorar</span>
        <h2 class="section-title">
          Todo lo que
          <br />
          <em class="section-title-accent">necesitás</em>
        </h2>
      </div>
      <button type="button" class="btn btn-ghost" (click)="goToAll()">Ver todo →</button>
    </div>

    <div class="categories-grid">
      @for (category of categories; track category.id) {
        <button
          type="button"
          [class]="'category-card ' + category.variantClass"
          (click)="goToCategory(category.id)"
        >
          <span class="category-card-icon" aria-hidden="true">{{ category.icon }}</span>
          <span class="category-card-body">
            <span class="category-card-count">{{ category.count }}</span>
            <span class="category-card-name-row">
              <span class="category-card-name">{{ category.name }}</span>
              <span class="category-card-arrow" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <path d="M7 17L17 7M17 7H7M17 7v10" />
                </svg>
              </span>
            </span>
          </span>
        </button>
      }
    </div>
  </div>
</section>
