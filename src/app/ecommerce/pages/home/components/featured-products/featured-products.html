<section class="section products-section">
  <div class="container">
    <div class="section-header">
      <div>
        <span class="section-label">Top picks</span>
        <h2 class="section-title">Más <em class="section-title-accent">deseados</em></h2>
        <p class="section-subtitle">
          Los favoritos de nuestra comunidad. Fragancias que enamoran desde el primer spray.
        </p>
      </div>
      <a routerLink="/productos" class="btn btn-ghost">Ver todos →</a>
    </div>

    <div class="products-grid">
      @for (product of products; track product.id) {
        <app-product-card [product]="product" />
      }
    </div>
  </div>
</section>
