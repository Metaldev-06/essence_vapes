<app-hero />
<app-divider />
<app-categories />

@defer (on viewport) {
  <app-features />
} @placeholder (minimum 100ms) {
  <div class="defer-placeholder defer-placeholder--features"></div>
}

@defer (on viewport) {
  <app-featured-products />
} @placeholder (minimum 100ms) {
  <div class="defer-placeholder defer-placeholder--products"></div>
}

@defer (on viewport) {
  <app-decants-banner />
} @placeholder (minimum 100ms) {
  <div class="defer-placeholder defer-placeholder--decants"></div>
}

<!-- The anchor lives outside @defer so "#finder" links work before the section has rendered. -->
<div id="finder">
  @defer (on viewport) {
    <app-finder />
  } @placeholder (minimum 100ms) {
    <div class="defer-placeholder defer-placeholder--finder"></div>
  }
</div>
