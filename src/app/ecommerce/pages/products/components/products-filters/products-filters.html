<div class="products-filters">
  <div class="products-filters-chips" role="group" aria-label="Filtrar por categoría">
    @for (option of categories(); track option.id) {
      <button
        type="button"
        class="filter-chip"
        [class.active]="category() === option.id"
        [attr.aria-pressed]="category() === option.id"
        (click)="category.set(option.id)"
      >
        {{ option.label }}
      </button>
    }
  </div>

  <div class="products-filters-tools">
    @if (activeStylesCount() > 0) {
      <button type="button" class="filter-tag" (click)="clearStyles.emit()">
        {{ activeStylesCount() }} estilo{{ activeStylesCount() === 1 ? '' : 's' }} del finder
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18" />
        </svg>
      </button>
    }

    <label class="products-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.35-4.35" />
      </svg>
      <span class="sr-only">Buscar por marca o nombre</span>
      <input type="search" placeholder="Buscar por marca o nombre..." [value]="search()" (input)="onSearchInput($event)" />
    </label>

    <label class="products-sort">
      <span class="sr-only">Ordenar productos</span>
      <select [value]="sort()" (change)="onSortChange($event)">
        @for (option of sortOptions(); track option.id) {
          <option [value]="option.id">{{ option.label }}</option>
        }
      </select>
    </label>
  </div>
</div>
