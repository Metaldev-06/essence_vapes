<div class="products-filters">
  @if (styleOptions().length > 0) {
    <div class="products-filters-styles">
      <div class="style-pills" role="group" aria-label="Filtrar por estilo">
        @for (style of styleOptions(); track style.id) {
          <button
            type="button"
            class="style-pill"
            [class.active]="activeStyles().has(style.id)"
            [attr.aria-pressed]="activeStyles().has(style.id)"
            (click)="toggleStyle.emit(style.id)"
          >
            <span aria-hidden="true">{{ style.emoji }}</span>
            {{ style.label }}
          </button>
        }
      </div>

      @if (activeStyles().size > 0) {
        <button type="button" class="clear-styles" (click)="clearStyles.emit()">
          Limpiar estilos
          <svg
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      }
    </div>
  } @else {
    <div class="products-filters-placeholder">
      <span class="products-filters-placeholder-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="7" cy="7" r="2.6" />
          <circle cx="17" cy="7" r="2.6" />
          <circle cx="7" cy="17" r="2.6" />
          <circle cx="17" cy="17" r="2.6" />
        </svg>
      </span>
      <div>
        <p class="products-filters-placeholder-title">Explorá todo el catálogo</p>
        <p class="products-filters-placeholder-hint">
          Elegí una categoría para mostrar filtros específicos de fragancias o sabores.
        </p>
      </div>
    </div>
  }

  <div class="products-filters-tools">
    <label class="products-search">
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.35-4.35" />
      </svg>
      <span class="sr-only">Buscar por marca o nombre</span>
      <input
        type="search"
        placeholder="Buscar por marca o nombre..."
        [value]="search()"
        (input)="onSearchInput($event)"
      />
    </label>

    <label class="products-sort">
      <span class="sr-only">Ordenar productos</span>
      <select (change)="onSortChange($event)">
        @for (option of sortOptions(); track option.id) {
          <option [value]="option.id" [selected]="option.id === sort()">{{ option.label }}</option>
        }
      </select>
    </label>
  </div>
</div>
