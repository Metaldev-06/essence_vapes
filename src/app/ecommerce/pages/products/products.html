<app-products-header [count]="total()" />

<section class="section products-body">
  <div class="container">
    <app-products-filters
      [categories]="categories"
      [sortOptions]="sortOptions"
      [(category)]="activeCategory"
      [(sort)]="sortBy"
      [(search)]="search"
      [activeStyles]="activeStyles()"
      (toggleStyle)="toggleStyle($event)"
      (clearStyles)="clearStyles()"
    />

    <app-products-grid
      [products]="items()"
      [isLoading]="isLoading()"
      [hasMore]="hasMore()"
      (loadMore)="loadMore()"
    />
  </div>
</section>
