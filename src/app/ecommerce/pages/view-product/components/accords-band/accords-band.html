@if (hasContent()) {
  <div class="accords-band">
    @if (pills().length > 0) {
      <div class="accords-band-pills">
        <span class="accords-band-label">Acordes principales</span>
        <div class="accords-band-list">
          @for (item of pills(); track item) {
            <span class="accords-pill">{{ item }}</span>
          }
        </div>
      </div>
    }

    @if (description()) {
      @if (pills().length > 0) {
        <div class="accords-band-divider" aria-hidden="true"></div>
      }
      <p class="accords-band-desc">{{ description() }}</p>
    }
  </div>
}
