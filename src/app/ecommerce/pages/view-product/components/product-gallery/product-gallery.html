<div class="product-gallery-wrapper" [style.--accent-color]="product().accent">
  <div class="product-gallery">
    <div class="product-gallery-glow" aria-hidden="true"></div>

    @if (product().badge) {
      <span class="product-gallery-badge">{{ product().badge }}</span>
    }

    @if (activeImage(); as image) {
      <a
        class="product-gallery-zoom"
        [href]="image.url"
        target="_blank"
        rel="noopener"
        [attr.aria-label]="'Ampliar imagen de ' + product().name"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m11 0h3a2 2 0 0 0 2-2v-3" />
        </svg>
      </a>
      <img [ngSrc]="image.url" [alt]="product().name" fill priority class="product-gallery-photo" />
    } @else {
      <svg class="product-gallery-bottle" viewBox="0 0 100 180" aria-hidden="true">
        <rect x="38" y="8" width="24" height="14" rx="4" class="product-gallery-bottle-cap" />
        <rect x="14" y="26" width="72" height="146" rx="16" class="product-gallery-bottle-body" />
        <rect x="24" y="66" width="52" height="66" rx="6" class="product-gallery-bottle-label" />
      </svg>
    }
  </div>

  @if (product().images.length > 1) {
    <div class="product-gallery-thumbs" role="group" [attr.aria-label]="'Más imágenes de ' + product().name">
      @for (image of product().images; track image.publicId; let i = $index) {
        <button
          type="button"
          class="product-gallery-thumb"
          [class.active]="i === activeImageIndex()"
          [attr.aria-pressed]="i === activeImageIndex()"
          [attr.aria-label]="'Ver imagen ' + (i + 1) + ' de ' + product().images.length"
          (click)="selectImage(i)"
        >
          <img [ngSrc]="image.url" alt="" width="64" height="64" />
        </button>
      }
    </div>
  }
</div>
