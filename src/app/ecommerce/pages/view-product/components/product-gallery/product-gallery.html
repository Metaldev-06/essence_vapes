<div class="product-gallery" [style.--accent-color]="accentVar()">
  <div class="product-gallery-glow" aria-hidden="true"></div>

  @if (product().badge) {
    <span class="product-gallery-badge">{{ product().badge }}</span>
  }

  <button
    type="button"
    class="product-gallery-favorite"
    [class.active]="isFavorite()"
    [attr.aria-pressed]="isFavorite()"
    [attr.aria-label]="isFavorite() ? 'Quitar de favoritos' : 'Agregar a favoritos'"
    (click)="toggleFavorite()"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" [attr.fill]="isFavorite() ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2">
      <path
        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
      />
    </svg>
  </button>

  <svg class="product-gallery-bottle" viewBox="0 0 100 180" aria-hidden="true">
    <rect x="38" y="8" width="24" height="14" rx="4" class="product-gallery-bottle-cap" />
    <rect x="14" y="26" width="72" height="146" rx="16" class="product-gallery-bottle-body" />
    <rect x="24" y="66" width="52" height="66" rx="6" class="product-gallery-bottle-label" />
  </svg>
</div>
