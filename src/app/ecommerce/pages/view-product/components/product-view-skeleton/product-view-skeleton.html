<div class="product-view-skeleton" role="presentation" aria-hidden="true">
  <div class="skeleton-breadcrumb">
    <span class="skeleton-line shimmer skeleton-crumb"></span>
    <span class="skeleton-line shimmer skeleton-crumb"></span>
    <span class="skeleton-line shimmer skeleton-crumb long"></span>
  </div>

  <div class="skeleton-layout">
    <div class="skeleton-gallery shimmer"></div>

    <div class="skeleton-details">
      <span class="skeleton-pill shimmer skeleton-category"></span>
      <span class="skeleton-line shimmer skeleton-brand"></span>
      <span class="skeleton-line shimmer skeleton-name"></span>
      <span class="skeleton-line shimmer skeleton-name-short"></span>
      <span class="skeleton-line shimmer skeleton-subtitle"></span>

      <div class="skeleton-row skeleton-facts">
        <span class="skeleton-pill shimmer short"></span>
        <span class="skeleton-pill shimmer"></span>
        <span class="skeleton-pill shimmer short"></span>
      </div>

      <span class="skeleton-line shimmer skeleton-rating"></span>
      <span class="skeleton-price shimmer"></span>

      <div class="skeleton-row">
        <span class="skeleton-pill shimmer"></span>
        <span class="skeleton-pill shimmer long"></span>
        <span class="skeleton-pill shimmer"></span>
        <span class="skeleton-pill shimmer short"></span>
      </div>

      <div class="skeleton-desc">
        <span class="skeleton-line shimmer"></span>
        <span class="skeleton-line shimmer"></span>
        <span class="skeleton-line shimmer skeleton-desc-last"></span>
      </div>

      <div class="skeleton-row skeleton-actions">
        <span class="skeleton-stepper shimmer"></span>
        <span class="skeleton-button shimmer"></span>
      </div>
    </div>
  </div>
</div>
