<section class="section related-products-section">
  <div class="container">
    <div class="section-header">
      <div>
        <span class="section-label">Descubrí más</span>
        <h2 class="section-title">También te puede <em class="section-title-accent">gustar</em></h2>
        <p class="section-subtitle">Acordes compartidos, mismo perfil olfativo.</p>
      </div>
    </div>

    <div class="related-products-grid">
      @for (item of items(); track item.product.id) {
        <div class="related-item">
          @if (item.matchPercent) {
            <span class="related-match">{{ item.matchPercent }}% match</span>
          }
          <app-product-card [product]="item.product" />
        </div>
      }
    </div>
  </div>
</section>
