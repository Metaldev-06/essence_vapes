@if (visible()) {
  <div class="verify-banner" role="alert">
    <div class="verify-banner-content">
      <span>Verificá tu correo para terminar de activar tu cuenta.</span>
      @if (message()) {
        <span class="verify-banner-message">{{ message() }}</span>
      }
    </div>
    <div class="verify-banner-actions">
      <button type="button" class="verify-banner-action" [disabled]="resending()" (click)="resend()">
        {{ resending() ? 'Enviando...' : 'Reenviar correo' }}
      </button>
      <a class="verify-banner-action" [routerLink]="'/cuenta'">Ir a Configuración</a>
      <button type="button" class="verify-banner-close" aria-label="Descartar aviso" (click)="dismiss()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>
}
